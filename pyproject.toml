[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cathodescope"
version = "0.1.0"
description = "Reproducible scientific workflow platform for benchmarked Li-ion cathode screening"
requires-python = ">=3.11"
dependencies = [
    "pymatgen",
    "ase",
    "mace-torch",
    "mp-api",
    "pydantic>=2.0",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
    "mypy",
    "pre-commit",
    "freezegun",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["cathodescope*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = "cathodescope.models.*"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
