repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic>=2.0
        # Run mypy only on the production package, matching CI behaviour.
        # Test files are excluded: integration tests use real MACE/ASE objects
        # that are untyped, and unit tests use untyped pytest decorators.
        pass_filenames: false
        args: [--ignore-missing-imports, cathodescope/]
